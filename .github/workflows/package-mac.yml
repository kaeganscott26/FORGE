name: Build and release macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package universal macOS app
    runs-on: macos-latest
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Create or validate the draft tag release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json tagName,targetCommitish
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "FORGE ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
          fi

      - name: Build unsigned workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac:universal

      - name: Package signed and notarized tag artifacts
        if: ${{ github.event_name == 'push' && env.HAS_SIGNING_CERTIFICATE == 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run clean:dist
          npm run build
          npx electron-builder --mac --universal --publish never --config.mac.hardenedRuntime=true
          node scripts/write-build-manifest.mjs universal

      - name: Package unsigned tag artifacts
        if: ${{ github.event_name == 'push' && env.HAS_SIGNING_CERTIFICATE != 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac:universal

      - name: Upload and verify tag assets serially
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            bash scripts/upload-release-assets.sh "$GITHUB_REF_NAME" beta
          else
            bash scripts/upload-release-assets.sh "$GITHUB_REF_NAME" latest
          fi

      - name: Publish the verified tag release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false --title "FORGE ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest --title "FORGE ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
          fi

      - name: Upload workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: FORGE-macOS-universal
          path: |
            dist_electron/FORGE-*.dmg
            dist_electron/FORGE-*.zip
            dist_electron/*.blockmap
            dist_electron/latest-mac.yml
            dist_electron/beta-mac.yml
            dist_electron/build-manifest.json
          if-no-files-found: error
