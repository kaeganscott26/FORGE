name: Temporary file.read repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-file-read:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch file.read and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/agent-tools/src/index.ts')
          source = source_path.read_text()
          source = source.replace(
              'const MAX_RANGED_TEXT_BYTES = 8_000_000;',
              'const MAX_RANGED_TEXT_BYTES = 64_000_000;'
          )
          old = """    this.executors.set('file.read', async (input, request) => {\n      const absolute = await resolveContainedPath(this.root(request), input.path, true); if (!await pathExists(absolute)) return ok(missing(input.path));\n      const data = await readText(absolute, input.startLine !== undefined || input.endLine !== undefined || input.offset !== undefined ? MAX_RANGED_TEXT_BYTES : MAX_TEXT_BYTES);\n"""
          new = """    this.executors.set('file.read', async (input, request) => {\n      const absolute = await resolveContainedPath(this.root(request), input.path, true); if (!await pathExists(absolute)) return ok(missing(input.path));\n      const stat = await fs.stat(absolute);\n      if (!stat.isFile()) return ok({ path: input.path, unreadable: true, reason: 'not-a-file', recovery: { action: 'list-path', path: input.path, instruction: 'Use file.list for directories, then call file.read with an observed file path.' } });\n      const data = await readText(absolute, MAX_RANGED_TEXT_BYTES);\n"""
          if old not in source:
              raise SystemExit('Expected file.read executor block was not found; refusing to patch stale code.')
          source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('packages/agent-tools/test/runtime.test.ts')
          tests = test_path.read_text()
          marker = """  it('advertises only tools available to the current FORGE configuration', () => {\n"""
          addition = """  it('keeps file.read recoverable for directories and bounded reads above the legacy 2 MB limit', async () => {\n    const root = await mkdtemp(path.join(os.tmpdir(), 'forge-read-resilience-'));\n    await mkdir(path.join(root, 'folder'));\n    await writeFile(path.join(root, 'large.txt'), 'x'.repeat(2_100_000));\n    const router = new ToolRouter({ git: fakeGit, shell: fakeShell, web: fakeWeb, audit: { appendAction: async () => undefined, listActions: async () => [] }, dirtyPaths: () => new Set() });\n    const context = { workspaceId: 'workspace-1', workspaceRoot: root, conversationId: 'conversation-1', modelId: 'test-model' };\n    const directory = await router.request({ id: 'read-directory', name: 'file.read', provider: 'test', arguments: { path: 'folder' } }, context);\n    expect(directory.result?.success).toBe(true);\n    expect(directory.result?.output).toMatchObject({ success: true, unreadable: true, reason: 'not-a-file', recovery: { action: 'list-path', path: 'folder' } });\n    const large = await router.request({ id: 'read-large', name: 'file.read', provider: 'test', arguments: { path: 'large.txt', maxCharacters: 64 } }, context);\n    expect(large.result?.success).toBe(true);\n    expect(large.result?.output).toMatchObject({ content: 'x'.repeat(64), truncated: true, continuation: { offset: 64 } });\n  });\n\n"""
          if marker not in tests:
              raise SystemExit('Expected runtime test insertion point was not found; refusing to patch stale tests.')
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests)
          PY
      - name: Run focused agent-tool tests
        run: npx vitest run packages/agent-tools/test/runtime.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit repaired runtime
        run: |
          rm .github/workflows/temporary-file-read-fix.yml
          git config user.name "FORGE Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/agent-tools/src/index.ts packages/agent-tools/test/runtime.test.ts .github/workflows/temporary-file-read-fix.yml
          git commit -m "fix(agent): harden file.read runtime"
          git push origin HEAD:main
